<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Ice Cream Stock</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4 mx-auto"
         style="max-width: 400px;">

        <h3 class="text-center mb-4">
            🍦 Ice Cream Stock Login
        </h3>

        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input id="username"
                   type="text"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input id="password"
                   type="password"
                   class="form-control">

        </div>

        <button class="btn btn-dark w-100"
                onclick="login()">
            Login
        </button>

    </div>
</div>

<!-- LOGIN CREDENTIALS ERROR MODAL -->
<div class="modal fade" id="loginErrorModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Login Failed</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="loginErrorMessage"></div>
            <div class="modal-footer">
                <button class="btn btn-primary" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>

<!-- LOGIN FUNCTION -->
<script>

    function login() {

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        fetch(`/login?username=${username}&password=${password}`, {
            method: "POST"
        })
        .then(response => {
            if (response.status === 500) {
                showError("Invalid credentials. Username or password incorrect.");
                return;
            }
            if (!response.ok) {
                showError("Login failed.");
                return;
            }
            return response.json();
        })
        .then(user => {
            if (!user) return;
            
            localStorage.setItem("username", user.username);
            localStorage.setItem("role", user.role);
            window.location.href = "/index.html";
        })
        .catch(() => {
            showError("Connection error.");
        });

    }

    function showError(message) {
        document.getElementById("loginErrorMessage").textContent = message;
        new bootstrap.Modal(document.getElementById("loginErrorModal")).show();
    }

</script>

</body>

</html>
