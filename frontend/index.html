<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Stock</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- NAV -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" href="#">🍦 Ice Cream Stock</a>
</nav>

<!-- HERO -->
<div class="container mt-4">
    <div class="p-4 bg-light rounded">
        <h2 class="fw-bold">Dashboard de Stock 🍦</h2>
        <p class="mb-0">Gestão simples de gelados (interface)</p>
    </div>
</div>

<!-- SELL CUP BUTTON -->
<div class="container mt-3">
    <button class="btn btn-danger w-100 py-3 fw-bold fs-5" onclick="sellCup()">
        🍦 SELL CUP
    </button>
</div>

<script>
    function sellCup() {
        const flavor = prompt("Enter flavour:");
        const cups = prompt("Enter number of cups:");

        if (!flavor || !cups) return;

        // Fetch API is a built-in JS function used to make HTTP requests from the browser to a backend API.
        // It allows the frontend to communicate with the server through endpoints without reloading the page.
        fetch(`http://localhost:8080/sell?flavor=${flavor}&cups=${cups}`, {
            method: "POST"
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(err => { throw new Error(err); });
            }
            return response.text();
        })
        .then(data => {
            alert(data);
            location.reload();
        })
        .catch(err => {
            alert("Error: " + err.message);
        });
    }
</script>

<!-- CARDS (STATIC FRONT ONLY) -->
<div class="container mt-4">
    <div class="row g-3">

        <div class="col-12 col-md-4 text-center">
            <div class="card shadow-sm p-3">
                <img src="assets/chocolate.png" class="img-fluid mb-2">
                <h6>Chocolate</h6>
            </div>
        </div>

        <div class="col-12 col-md-4 text-center">
            <div class="card shadow-sm p-3">
                <img src="assets/morango.png" class="img-fluid mb-2">
                <h6>Morango</h6>
            </div>
        </div>

        <div class="col-12 col-md-4 text-center">
            <div class="card shadow-sm p-3">
                <img src="assets/baunilha.png" class="img-fluid mb-2">
                <h6>Baunilha</h6>
            </div>
        </div>

    </div>

    <!-- PAGINATION VISUAL ONLY -->
    <div class="text-center mt-4">
        <button class="btn btn-dark">↓ Carregar mais</button>
    </div>
</div>

<!-- TABLE ADMIN -->
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Gestão de Stock</h4>

        <button class="btn btn-success">+ Adicionar</button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Sabor</th>
                    <th>Stock (KG)</th>
                    <th>Buckets</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>1</td>
                    <td>Chocolate</td>
                    <td>100</td>
                    <td>20</td>
                    <td>
                        <button class="btn btn-warning btn-sm">Editar</button>
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Morango</td>
                    <td>75</td>
                    <td>15</td>
                    <td>
                        <button class="btn btn-warning btn-sm">Editar</button>
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </td>
                </tr>

            </tbody>

        </table>
    </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-4 mt-5">
    <div class="container">
        <p class="fw-bold mb-1">🍦 Ice Cream Stock</p>
        <p class="mb-2">Sistema simples de gestão de stock de gelados</p>
        <small class="text-muted">© 2026 Ice Cream Stock</small>
    </div>
</footer>

</body>
</html>
