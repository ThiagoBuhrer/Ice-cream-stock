<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Stock</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- NAV -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" href="#">🍦 Ice Cream Stock</a>
</nav>

<!-- HERO -->
<div class="container mt-4">
    <div class="p-4 bg-light rounded">
        <h2 class="fw-bold">Dashboard de Stock 🍦</h2>
        <p class="mb-0">Gestão simples de gelados (interface)</p>
    </div>
</div>

<!-- SELL CUP BUTTON -->
<div class="container mt-3">
    <button class="btn btn-danger w-100 py-3 fw-bold fs-5"
            onclick="openSellOffcanvas()">
        🍦 SELL CUP
    </button>
</div>

<!-- SELL OFFCANVAS -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="sellOffcanvas">

    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Sell Ice Cream</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="offcanvas-body">

        <form onsubmit="sellFromOffcanvas(event)">

            <div class="mb-3">
                <label class="form-label">Flavor</label>
                <input id="sellFlavor" type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Cups</label>
                <input id="sellCups" type="number" class="form-control">
            </div>

            <button type="submit" class="btn btn-danger w-100">
                Sell
            </button>

        </form>

    </div>
</div>

<script>
    function openSellOffcanvas() {
        const offcanvas = new bootstrap.Offcanvas(
            document.getElementById('sellOffcanvas')
        );
        offcanvas.show();
    }

    function sellFromOffcanvas(event) {
        event.preventDefault();

        const flavor = document.getElementById("sellFlavor").value;
        const cups = document.getElementById("sellCups").value;

        fetch(`http://localhost:8080/sell?flavor=${flavor}&cups=${cups}`, {
            method: "POST"
        })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(err => { throw new Error(err); });
                }
                return response.text();
            })
            .then(data => {
                alert(data);
                refreshUI();
            })
            .catch(err => {
                alert("Error: " + err.message);
            });
    }
</script>

<!-- CARDS -->
<div class="container mt-4">

    <div class="row g-3" id="cardsContainer">
    </div>

    <!-- PAGINATION VISUAL ONLY -->
    <div class="text-center mt-4">
        <button class="btn btn-dark">↓ Carregar mais</button>
    </div>

</div>

<!-- CARDS + TABLE LOADING AND RENDERING SCRIPT -->
<script>

    // API base URL used to fetch all ice cream records from the backend
    const API_URL = "http://localhost:8080/icecream";

    // Executes when the DOM is fully loaded to ensure all HTML elements exist
    document.addEventListener("DOMContentLoaded", () => {
        loadCards();
        loadTable();
    });

    // Fetches ice cream data from backend API and renders items as UI cards
    function loadCards() {
        fetch(API_URL)
            .then(response => response.json())
            .then(data => {

                const cardsContainer = document.getElementById("cardsContainer");

                // Clears previous content before rendering updated data
                cardsContainer.innerHTML = "";

                // Iterates over each ice cream object returned by the API
                data.forEach(iceCream => {

                    // Dynamically creates a Bootstrap card for each item
                    cardsContainer.innerHTML += `
                        <div class="col-12 col-md-4 text-center">
                            <div class="card shadow-sm p-3">
                                <h5>${iceCream.flavor}</h5>
                                <p>${iceCream.stockQuantityKG} KG</p>
                                <p>${iceCream.stockBuckets} Buckets</p>
                            </div>
                        </div>
                    `;

                });

            })
            .catch(error => {
                console.error(error);
            });
    }

    // Fetches ice cream data from the backend API and renders it into an HTML table
    function loadTable() {
    fetch(API_URL)
        .then(response => response.json())
        .then(data => {

            const tableBody = document.getElementById("tableBody");

            // Clears existing table content before inserting updated rows
            tableBody.innerHTML = "";

            // Iterates over each ice cream object returned by the API
            data.forEach(iceCream => {

                // Dynamically creates a table row for each ice cream entry
                tableBody.innerHTML += `
                    <tr>
                        <td>${iceCream.id ?? "-"}</td>
                        <td>${iceCream.flavor}</td>
                        <td>${iceCream.stockQuantityKG}</td>
                        <td>${iceCream.stockBuckets}</td>
                        <td>

                            <button class="btn btn-warning btn-sm">Edit</button>

                            <button class="btn btn-danger btn-sm"
                                onclick="deleteIceCream(${iceCream.id})">Delete
                            </button>

                        </td>
                    </tr>
                `;

            });

        })
        .catch(error => {
            console.error("Error loading table:", error);
        });
}

</script>

<!-- TABLE ADMIN -->
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Gestão de Stock</h4>

        <button class="btn btn-success"
                onclick="openAddOffcanvas()">
            + Adicionar
        </button>
</div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Flavour</th>
                    <th>Stock (KG)</th>
                    <th>Buckets</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="tableBody">
            </tbody>

        </table>
    </div>
</div>

<!-- TABLE ADMIN OFFCANVAS -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="addOffcanvas">

    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Add Ice Cream</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="offcanvas-body">

        <form onsubmit="addIceCream(event)">

            <div class="mb-3">
                <label class="form-label">Flavor</label>
                <input id="addFlavor" type="text" class="form-control">
            </div>

            <!-- BUCKETS -->
            <div class="mb-3">
                <label class="form-label">Buckets</label>
                <input id="addBuckets"
                       type="number"
                       class="form-control"
                       oninput="updateStockLive()">
            </div>

            <!-- LIVE KG DISPLAY -->
            <div class="mb-3">
                <small class="text-muted">
                    Stock (KG): <span id="calculatedStock">0</span>
                </small>
            </div>

            <div class="mb-3">
                <label class="form-label">Made At</label>
                <input id="addDate" type="date" class="form-control">
            </div>

            <button class="btn btn-success w-100" type="submit">
                Create
            </button>

        </form>

    </div>
</div>

<!-- OPEN TABLE ADMIN OFFCANVAS + LOGIC -->
<script>

    // Function opens Bootstrap Offcanvas for "Add New Ice Cream" Form
    function openAddOffcanvas() {
        const el = document.getElementById("addOffcanvas");
        const offcanvas = new bootstrap.Offcanvas(el);
        offcanvas.show();
    }

    const KG_PER_BUCKET = 5;

    // Functions calculates Stock (KG) based on bucket input live
    function updateStockLive() {
        const buckets = parseInt(document.getElementById("addBuckets").value) || 0;
        const kg = buckets * KG_PER_BUCKET;

        document.getElementById("calculatedStock").innerText = kg;
    }

    // Function sends new ice cream data to backend API (POST Request)
    function addIceCream(event) {
        event.preventDefault();

        const buckets = parseInt(document.getElementById("addBuckets").value) || 0;
        const kg = buckets * 5;

        const iceCream = {
            flavor: document.getElementById("addFlavor").value,
            stockBuckets: buckets,
            stockQuantityKG: kg,
            madeAt: document.getElementById("addDate").value
        };

        fetch("http://localhost:8080/icecream", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(iceCream)
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(err => { throw new Error(err); });
            }
            return response.json();
        })
        .then(() => {
            alert("Ice Cream created successfully!");
            refreshUI();
        })
        .catch(err => {
            alert("Error: " + err.message);
        });
    }

    // Function sends DELETE request to the backend to remove an ice cream by its ID
    function deleteIceCream(id) {
    if (!confirm("Are you sure you want to delete this ice cream?")) return;

    fetch(`http://localhost:8080/icecream/${id}`, {
        method: "DELETE"
    })
    .then(response => {
        if (!response.ok) {
            return response.text().then(err => { throw new Error(err); });
        }
        return response.text();
    })
    .then(() => {
        refreshUI();
    })
    .catch(err => {
        alert("Error: " + err.message);
    });
    }

    // Function refreshes the user interface by reloading both the card view and the table view from the backend
    function refreshUI() {
    loadCards();
    loadTable();
}

</script>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-4 mt-5">
    <div class="container">
        <p class="fw-bold mb-1">🍦 Ice Cream Stock</p>
        <p class="mb-2">Sistema simples de gestão de stock de gelados</p>
        <small class="text-muted">© 2026 Ice Cream Stock</small>
    </div>
</footer>

</body>
</html>
